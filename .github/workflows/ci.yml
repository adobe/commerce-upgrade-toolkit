name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and security (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run encryption-safety checker (toolkit guardrail)
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          BASE_REF="$PR_BASE_SHA"
          if [ -z "$BASE_REF" ]; then
            echo "::error::Could not resolve a base SHA for the encryption-safety checker — failing closed."
            exit 1
          fi
          if ! git cat-file -e "$BASE_REF^{commit}" 2>/dev/null; then
            echo "::error::The encryption-safety base commit is unavailable. Fetch the event's base commit and retry; the scan cannot be skipped."
            exit 1
          fi
          node .claude/scripts/check-encryption-changes.mjs --base "$BASE_REF"

      - name: Check generated Copilot assets
        run: |
          npm run generate:github
          if [ -n "$(git status --porcelain -- .github)" ]; then
            git status --short -- .github
            git diff -- .github
            echo "::error::Regenerate and commit the Copilot assets before merging."
            exit 1
          fi

      - name: Secret-output gate
        run: npm run check:secret-safety

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install Semgrep (pinned)
        run: |
          # Semgrep's pinned OpenTelemetry dependency still imports pkg_resources.
          python -m pip install --disable-pip-version-check semgrep==1.97.0 setuptools==80.9.0
          semgrep --version

      - name: Run tests
        env:
          CCUA_REQUIRE_SEMGREP: '1'
        run: npm test

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Semgrep security gate (High/Critical block)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          python .claude/scripts/security_gate.py changed-scan \
            --base "$BASE_SHA" --head HEAD --output security-report.json

      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-report
          path: security-report.json
          if-no-files-found: warn
          retention-days: 30

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
